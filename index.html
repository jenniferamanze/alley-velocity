<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alley Velocity</title>
    <style>
        * { box-sizing: border-box; }
        html, body { margin: 0; height: 100%; }
        body {
            background: #1a1a1a; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px;
            min-height: 100vh; min-height: 100dvh; overflow: hidden; padding: 8px;
        }
        canvas {
            display: block; height: auto;
            width: min(92vw, calc((100vh - 110px) * 2 / 3));
            width: min(92vw, calc((100dvh - 110px) * 2 / 3));
            background: #222; border: 4px solid #d8fd71; border-radius: 8px;
            box-shadow: 0 0 20px rgba(216, 253, 113, 0.2);
            touch-action: none; user-select: none; -webkit-user-select: none;
        }
        #instructions { margin: 0; color: #aaa; font-size: 14px; text-align: center; }
        #signin {
            border: 0; border-radius: 999px; padding: 8px 16px; background: #d8fd71; color: #1a1a1a;
            font-weight: 700; font-size: 14px; cursor: pointer;
        }
        #signin:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="360" height="540" aria-label="Alley Velocity game"></canvas>
    <p id="instructions">Tap left or right to switch lanes. Arrow keys work too.</p>
    <button id="signin" hidden>Sign in to save your score</button>
    <script src="./game.js"></script>
</body>
</html>
