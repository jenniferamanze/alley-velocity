<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alley Velocity - Start.ng</title>
    <style>
        body { margin: 0; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; color: white; overflow: hidden; }
        canvas { background: #222; border: 4px solid #d8fd71; border-radius: 8px; box-shadow: 0 0 20px rgba(216, 253, 113, 0.2); }
        #instructions { margin-top: 12px; color: #aaa; font-size: 14px; letter-spacing: 0.5px; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="360" height="540"></canvas>
    <div id="instructions">Use Left and Right Arrow Keys to Dodge Traffic!</div>
    <script src="game.js"></script>

<!-- TEMPORARY PUBLISH BUTTON: Click this once in your browser to publish your game! -->
<button id="aiPublishBtn" style="position:fixed; top:20px; right:20px; z-index:9999; padding:15px; background:#d8fd71; color:#000; font-weight:bold; border:none; border-radius:8px; cursor:pointer;">
    🚀 CLICK TO PUBLISH GAME
</button>

<script>
document.getElementById('aiPublishBtn').addEventListener('click', async () => {
    const btn = document.getElementById('aiPublishBtn');
    btn.textContent = "Checking...";
    
    try {
        // 1. FIXED: Added 'api.' and '/games/publish' to the URL path
        const response = await fetch('https://start.ng', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                // 2. FIXED: Clean repository link pointing to your main branch
                "repo_url": "https://github.com/jenniferamanze/alley-velocity",
                "name": "alley-velocity"
            })
        });
        
        const data = await response.json();
        
        if (data.approve_url) {
            btn.style.background = "#00ff88";
            btn.textContent = "SUCCESS! CLICK TO APPROVE";
            btn.onclick = () => window.open(data.approve_url, '_blank');
        } else {
            btn.style.background = "#ff4757";
            btn.textContent = "Error: " + (data.detail || "Check console");
            console.log(data);
        }
    } catch (err) {
        btn.style.background = "#ff4757";
        btn.textContent = "Connection Failed";
        alert(err);
    }
});
</script>

</body>
</html>
